<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="app.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
</head>

<body>
    <div class="column">
        <header class="topbar">
            <label>Deck
                <select id="deck-select">
                    <optgroup label="JavaScript">
                        <option value="deck-variables-javascript.json">Variables et déclarations</option>
                        <option value="deck-functions-javascript.json">Fonctions et closures</option>
                        <option value="deck-conditions-javascript.json">Conditions et logique</option>
                        <option value="deck-loops-javascript.json">Boucles et itération</option>
                    </optgroup>
                    <optgroup label="Docker">
                        <option value="docker-quiz-30.json">Docker, architecture web</option>
                    </optgroup>
                </select>
            </label>
            <span class="status">
                <button id="random-toggle" class="text" disabled>Ordre : deck</button>
                <a id="take-quiz-btn" href="quiz.html">Quiz sur ce deck</a>
            </span>
        </header>

        <main class="flashcard" id="flashcard">
            <p class="flashcard-category meta" id="flashcard-category"></p>
            <div class="flashcard-content prompt" id="flashcard-content"></div>
            <ol class="flashcard-choices" id="flashcard-choices"></ol>
        </main>

        <div class="controls">
            <button id="prev-btn" class="text" disabled>Précédent <kbd>←</kbd></button>
            <button id="flip-btn" class="text" disabled>Retourner <kbd>espace</kbd></button>
            <button id="next-btn" class="text" disabled>Suivant <kbd>→</kbd></button>
            <span id="card-number" class="counter"></span>
        </div>
    </div>

    <script src="app.js" type="module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</body>

</html>
