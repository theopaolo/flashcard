<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour de cartes</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <!-- SOS Mode Overlay -->
    <div class="sos-overlay" style="display: none;"></div>

    <div class="oracle-container">
         <!-- Navigation -->
         <div class="navigation">
            <button class="oracle-btn" id="view-toggle-btn">Grille</button>
            <button class="oracle-btn" id="shuffle-btn">Shuffle</button>
            <button class="oracle-btn" id="flip-all-btn">Flip all</button>

            <!-- Auto Draw Button -->
            <button class="oracle-btn sos-btn" id="sos-btn" title="Tirage automatique de 3 cartes (Échap)">
                <svg class="sos-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" />
                </svg>
                <span class="sos-text">Auto</span>
            </button>

            <!-- Focus Button -->
            <button class="oracle-btn focus-toggle-btn" id="focus-toggle-btn" title="Mode focus (Alt)">
                <!-- Open Eye (shown when active - light mode) -->
                <svg class="focus-icon-open" width="16" height="16" fill="currentColor" viewBox="0 0 256 256">
                    <path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.47,133.47,0,0,1,25,128,133.33,133.33,0,0,1,48.07,97.25C70.33,75.19,97.22,64,128,64s57.67,11.19,79.93,33.25A133.46,133.46,0,0,1,231.05,128C223.84,141.46,192.43,192,128,192Zm0-112a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"></path>
                </svg>
                <!-- Closed Eye (shown when inactive - dark mode) -->
                <svg class="focus-icon-closed" width="16" height="16" viewBox="0 0 256 256" fill="currentColor">
                    <path d="M228,175a8,8,0,0,1-10.92-3l-19-33.2A123.23,123.23,0,0,1,162,155.46l5.87,35.22a8,8,0,0,1-6.58,9.21A8.4,8.4,0,0,1,160,200a8,8,0,0,1-7.88-6.69l-5.77-34.58a133.06,133.06,0,0,1-36.68,0l-5.77,34.58A8,8,0,0,1,96,200a8.4,8.4,0,0,1-1.32-.11,8,8,0,0,1-6.58-9.21L94,155.46a123.23,123.23,0,0,1-36.06-16.69L39,172A8,8,0,1,1,25.06,164l20-35a153.47,153.47,0,0,1-19.3-20A8,8,0,1,1,38.22,99c16.6,20.54,45.64,45,89.78,45s73.18-24.49,89.78-45A8,8,0,1,1,230.22,109a153.47,153.47,0,0,1-19.3,20l20,35A8,8,0,0,1,228,175Z" />
                </svg>
            </button>
        </div>

        <div class="container">
            <!-- Swiper Container -->
            <div class="swiper" id="cards-swiper">
                <div class="swiper-wrapper" id="swiper-wrapper">
                    <!-- Cards will be dynamically inserted here -->
                </div>
            </div>

            <!-- Grid Container -->
            <div class="grid-container" id="cards-grid" style="display: none;">
                <!-- Cards will be dynamically inserted here -->
            </div>
        </div>

        <footer>
            <div class="color-legend">
                <div class="legend-item legend-filter" data-category-id="favorites">
                    <span class="legend-dot legend-favorites">
                        <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
                        </svg>
                    </span>
                    <span class="legend-text">Favoris</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="1">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #E6DEB8, #D4CC9E)"></span>
                    <span class="legend-text">Démarrage</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="2">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #E6B8DA, #D99EC8)"></span>
                    <span class="legend-text">Focus</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="3">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #8CC2C1, #7AB0AF)"></span>
                    <span class="legend-text">Transition</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="4">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #918860, #7F7650)"></span>
                    <span class="legend-text">Bilan</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="5">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #66335A, #542A4A)"></span>
                    <span class="legend-text">Créativité</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="6">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #DE7D45, #CC6A33)"></span>
                    <span class="legend-text">Comportements</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="7">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #465E9C, #3A4E8A)"></span>
                    <span class="legend-text">Conseils</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="8">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #D5C7C8, #C3B5B6)"></span>
                    <span class="legend-text">Mantras</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="9">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #B33456, #A12244)"></span>
                    <span class="legend-text">Soins</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="10">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #758C50, #637A40)"></span>
                    <span class="legend-text">Relations</span>
                </div>
                <div class="legend-item legend-filter" data-category-id="11">
                    <span class="legend-dot" style="background: linear-gradient(135deg, #336665, #295453)"></span>
                    <span class="legend-text">Anxiété</span>
                </div>
            </div>
        </footer>
    </div>

    <script src="./tourdecartes.js" type="module"></script>
</body>

</html>
